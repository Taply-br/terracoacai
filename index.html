<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraço Açaí - Avaliação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1b26;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #9aa5ce;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .stars-container {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .star {
      font-size: 48px;
      color: #414868;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .star:active {
      transform: scale(1.2);
    }
  </style>

  <script>
    // URL do Google Maps do cliente (4 e 5 estrelas)
    const LINK_GOOGLE_MAPS = "https://maps.google.com"; 

    // URL do teu Google Forms (1, 2 e 3 estrelas)
    const LINK_FORMULARIO = "https://docs.google.com/forms/d/e/1FAIpQLSf04wJWS084rEUKiadvT-hDpSk2rzva-PwT6OszhDKYspNTUw/viewform?usp=sharing"; 

    function avaliar(estrelas) {
      if (estrelas >= 4) {
        window.location.href = LINK_GOOGLE_MAPS;
      } else {
        window.location.href = LINK_FORMULARIO;
      }
    }
  </script>
</head>
<body>

  <div class="container">
    <h1>Terraço Açaí</h1>
    <p class="subtitle">Como foi a sua experiência hoje?</p>

    <div class="stars-container">
      <span class="star" onclick="avaliar(1)">★</span>
      <span class="star" onclick="avaliar(2)">★</span>
      <span class="star" onclick="avaliar(3)">★</span>
      <span class="star" onclick="avaliar(4)">★</span>
      <span class="star" onclick="avaliar(5)">★</span>
    </div>
  </div>

</body>
</html>
