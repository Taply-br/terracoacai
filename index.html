<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Taply</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h2 {
      font-size: 20px;
      color: #111;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* Estrelas Vazias -> Preenchidas estilo Tally */
    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .star {
      font-size: 42px;
      color: #ccc;
      cursor: pointer;
      user-select: none;
      line-height: 1;
      transition: color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .star.filled {
      color: #ffcc00;
    }
    .star:active {
      transform: scale(1.2);
    }

    #form-container {
      display: none;
      margin-top: 20px;
    }
    .subtitle {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 15px;
    }
    iframe {
      width: 100%;
      height: 550px;
      border: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div id="step-rating">
    <h2>Como avalia a sua experiência?</h2>
    <p>Selecione uma nota de 1 a 5:</p>
    
    <div class="stars" id="star-container">
      <span class="star" data-value="1">☆</span>
      <span class="star" data-value="2">☆</span>
      <span class="star" data-value="3">☆</span>
      <span class="star" data-value="4">☆</span>
      <span class="star" data-value="5">☆</span>
    </div>
  </div>

  <!-- Google Form para notas de 1 a 4 -->
  <div id="form-container">
    <p class="subtitle">A sua opinião é fundamental para nós. Por favor, partilhe o seu comentário no formulário abaixo:</p>
    <iframe id="google-form" src="" frameborder="0">Carregando…</iframe>
  </div>
</div>

<script>
  const LINK_DESTINO_5_ESTRELAS = "https://www.google.com"; 
  const LINK_GOOGLE_FORM = "https://docs.google.com/forms/d/e/1FAIpQLSf04wJWS084rEUKiadvT-hDpSk2rzva-PwT6OszhDKYspNTUw/viewform?embedded=true";

  const stars = document.querySelectorAll('.star');
  const iframe = document.getElementById('google-form');

  stars.forEach((star, index) => {
    star.addEventListener('mouseover', () => highlightStars(index));
    star.addEventListener('mouseleave', () => resetStars());
    star.addEventListener('click', () => {
      const nota = index + 1;
      avaliar(nota);
    });
  });

  function highlightStars(index) {
    stars.forEach((s, i) => {
      if (i <= index) {
        s.classList.add('filled');
        s.textContent = '★';
      } else {
        s.classList.remove('filled');
        s.textContent = '☆';
      }
    });
  }

  function resetStars() {
    stars.forEach((s) => {
      s.classList.remove('filled');
      s.textContent = '☆';
    });
  }

  function avaliar(nota) {
    if (nota === 5) {
      window.location.href = LINK_DESTINO_5_ESTRELAS;
    } else {
      document.getElementById('step-rating').style.display = 'none';
      iframe.src = LINK_GOOGLE_FORM;
      document.getElementById('form-container').style.display = 'block';
    }
  }
</script>

</body>
</html>
