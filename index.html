<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraço Açaí - Avaliação</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: #1e1e24;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a35;
        }

        h1 {
            color: #bd93f9;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #a9a9b6;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .star {
            font-size: 36px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            color: #44475a;
        }

        .star.active {
            color: #ffb86c;
        }

        .star:hover {
            transform: scale(1.2);
        }

        .feedback-box {
            display: none;
            margin-top: 20px;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #282a36;
            border: 1px solid #44475a;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            margin-bottom: 15px;
        }

        .btn-send {
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            border: none;
            font-size: 16px;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background-color: #1eb954;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #6272a4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Terraço Açaí</h1>
        <p class="subtitle">Sua opinião é super importante para nós! Como foi sua experiência?</p>
        
        <!-- ESTRELAS INTERATIVAS -->
        <div class="stars-container" id="starsGroup">
            <span class="star" onclick="avaliar(1)">★</span>
            <span class="star" onclick="avaliar(2)">★</span>
            <span class="star" onclick="avaliar(3)">★</span>
            <span class="star" onclick="avaliar(4)">★</span>
            <span class="star" onclick="avaliar(5)">★</span>
        </div>

        <!-- FORMULÁRIO DE FEEDBACK INTERNO (PARA 1 A 3 ESTRELAS) -->
        <div class="feedback-box" id="feedbackBox">
            <p style="font-size: 13px; color: #a9a9b6; margin-bottom: 10px;">Conte-nos o que podemos melhorar:</p>
            <textarea id="feedbackText" placeholder="Escreva sua mensagem aqui..."></textarea>
            <button class="btn-send" onclick="enviarWhatsApp()">Enviar Feedback Direto</button>
        </div>

        <p class="footer-text">Rua Coronel João de Oliveira, 1030 — Messejana</p>
    </div>

    <script>
        const LINK_GOOGLE = "https://search.google.com/local/writereview?placeid=ChIJPXFhMFJPxwcRxZGpikolulw";
        const WHATSAPP_NUMERO = "5585999999999"; // Substitua pelo WhatsApp do cliente

        function avaliar(nota) {
            const stars = document.querySelectorAll('.star');
            stars.forEach((s, index) => {
                if (index < nota) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });

            if (nota >= 4) {
                setTimeout(() => {
                    window.location.href = LINK_GOOGLE;
                }, 300);
            } else {
                document.getElementById('feedbackBox').style.display = 'block';
            }
        }

        function enviarWhatsApp() {
            const mensagem = document.getElementById('feedbackText').value;
            if(!mensagem.trim()) {
                alert("Por favor, digite sua mensagem antes de enviar.");
                return;
            }
            const url = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent('Feedback sobre o Terraço Açaí: ' + mensagem)}`;
            window.location.href = url;
        }
    </script>

</body>
</html>
